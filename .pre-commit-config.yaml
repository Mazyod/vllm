default_install_hook_types:
  - pre-commit
  - commit-msg
default_stages:
  - pre-commit
  - manual
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19
    hooks:
      - id: ruff-check
        args: [--output-format, github, --fix]
      - id: ruff-format
  - repo: https://github.com/crate-ci/typos
    rev: 9023c1f779400877cafdd98052113fc777e2cfdc
    hooks:
      - id: typos
        args: [--force-exclude]
        # Matplotlib generates hexadecimal SVG IDs; check prose in the renderer.
        exclude: ^fork/bench/configs/pending/gemma-4-nightly/shared-h200/.*\.svg$
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4
    hooks:
      - id: markdownlint-cli2
        language_version: 24.22.1
        args: [--config, .markdownlint.yaml, --fix]
        exclude: (^|/)CLAUDE\.md$
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca
    hooks:
      - id: actionlint
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: signoff-commit
        name: Sign-off Commit
        entry: bash
        args:
          - -c
          - |
            if ! grep -q "^Signed-off-by: $(git config user.name) <$(git config user.email)>" "$(git rev-parse --git-path COMMIT_EDITMSG)"; then
              printf "\nSigned-off-by: $(git config user.name) <$(git config user.email)>\n" >> "$(git rev-parse --git-path COMMIT_EDITMSG)"
            fi
        language: system
        verbose: true
        stages: [commit-msg]
