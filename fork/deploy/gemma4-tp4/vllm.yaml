# TP4 deployment adaptation of the tested TP2 recipe; TP4 was not benchmarked.
model: RedHatAI/gemma-4-31B-it-FP8-block
revision: d7242548c457ab4b45bd3adb8937f2659af4739d
served-model-name: gemma-4-31b
dtype: bfloat16
tensor-parallel-size: 4

max-model-len: 32768
max-num-seqs: 8
max-num-batched-tokens: 4096
enable-prefix-caching: true

kv-cache-dtype: fp8
# 1.25 GiB per GPU: preserves the tested TP2 recipe's 5 GiB aggregate budget.
kv-cache-memory-bytes: 1342177280
# Startup free-memory threshold; not a hard cap with explicit KV bytes.
gpu-memory-utilization: 0.25

# Required for Gemma FP8 + MTP on this Hopper nightly.
attention-config:
  backend: TRITON_ATTN
speculative-config:
  method: mtp
  model: google/gemma-4-31B-it-assistant
  revision: 627c5ec1458b9086b841a91e0512fd31fd2fbbf1
  num_speculative_tokens: 4

reasoning-parser: gemma4
tool-call-parser: gemma4
enable-auto-tool-choice: true

# Carry the fork's PCIe collective workarounds; FlashInfer all-reduce is
# separately disabled in compose.yaml. This does not change attention selection.
disable-custom-all-reduce: true
compilation-config:
  pass_config:
    fuse_allreduce_rms: false
