model: /workspace/models/gemma
served-model-name: gemma
runner: pooling
convert: embed
dtype: float
tensor-parallel-size: 1
enforce-eager: true
max-model-len: 256
max-num-seqs: 4
gpu-memory-utilization: 0.25
host: 127.0.0.1
# The bidirectional window has radius 256. Within this cap, full attention
# preserves the model mask. Longer inputs require an actual sliding backend.
disable-sliding-window: true
hf-overrides: '{"is_causal": false}'
