# TP4 adaptation of the tested TP1/TP2 Hopper FP8 + MTP configuration.
model: RedHatAI/gemma-4-31B-it-FP8-block
revision: d7242548c457ab4b45bd3adb8937f2659af4739d
served-model-name: gemma-4-31b
trust-remote-code: false
dtype: bfloat16
distributed-executor-backend: mp
tensor-parallel-size: 4

max-model-len: 32768
max-num-seqs: 8
max-num-batched-tokens: 4096
enable-prefix-caching: true
kv-cache-dtype: fp8
# 1.25 GiB per GPU; preserves the tested TP2 recipe's 5 GiB aggregate budget.
kv-cache-memory-bytes: 1342177280
# Startup free-memory threshold; explicit KV bytes mean this is NOT a VRAM cap.
gpu-memory-utilization: 0.15

# Required for target AND shared-cache MTP draft on the tested Hopper nightly.
attention-config:
  backend: TRITON_ATTN
speculative-config:
  method: mtp
  model: google/gemma-4-31B-it-assistant
  revision: 627c5ec1458b9086b841a91e0512fd31fd2fbbf1
  num_speculative_tokens: 4

# Keep images; exclude video/audio from the requested text + image service.
language-model-only: false
limit-mm-per-prompt:
  image: 8
  video: 0
  audio: 0
mm-processor-kwargs:
  max_soft_tokens: 280
mm-processor-cache-gb: 4

reasoning-parser: gemma4
tool-call-parser: gemma4
enable-auto-tool-choice: true
default-chat-template-kwargs:
  enable_thinking: false

# Existing fork PCIe collective workarounds; paired with the stack env flag.
disable-custom-all-reduce: true
compilation-config:
  pass_config:
    fuse_allreduce_rms: false
