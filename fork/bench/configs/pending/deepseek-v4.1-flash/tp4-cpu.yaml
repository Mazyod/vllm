# Candidate for the pinned V4.1 development image; not release-certified.
model: /workspace/models/v41
served-model-name: dsv41
tokenizer-mode: deepseek_v41
tensor-parallel-size: 4
max-model-len: 32768
max-num-seqs: 32
max-num-batched-tokens: 4096
kv-cache-memory-bytes: 4294967296
no-enable-prefix-caching: true
engram-config:
  cpu_offload: true
compilation-config:
  cudagraph_capture_sizes:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
