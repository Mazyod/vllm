# Effective model-process settings after harness cache-path overrides.
# Container GPU selection is separate: expose exactly two GPUs.
CUDA_VISIBLE_DEVICES: 0,1
HF_HOME: /workspace/hf
HF_HUB_OFFLINE: '1'
TORCHINDUCTOR_CACHE_DIR: /root/.cache/vllm/deepseek/inductor
TRITON_CACHE_DIR: /root/.cache/vllm/deepseek/triton
VLLM_ALLREDUCE_USE_FLASHINFER: '0'
VLLM_ALLREDUCE_USE_SYMM_MEM: '0'
VLLM_CACHE_ROOT: /root/.cache/vllm/deepseek
VLLM_DEEP_GEMM_WARMUP: skip
VLLM_ENGINE_READY_TIMEOUT_S: '3600'
VLLM_USE_NCCL_SYMM_MEM: '0'
VLLM_USE_RUST_FRONTEND: '0'
VLLM_USE_V2_MODEL_RUNNER: '1'
